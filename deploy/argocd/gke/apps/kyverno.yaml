apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"   # install before the policies
spec:
  project: default
  source:
    repoURL: https://kyverno.github.io/kyverno/
    chart: kyverno
    targetRevision: 3.2.6
    helm:
      values: |
        # Bitnami deprecated public bitnami/kubectl (2025); use relocated repo.
        webhooksCleanup:      { image: { repository: bitnamilegacy/kubectl } }
        policyReportsCleanup: { image: { repository: bitnamilegacy/kubectl } }
        cleanupJobs:
          admissionReports:        { image: { repository: bitnamilegacy/kubectl } }
          clusterAdmissionReports: { image: { repository: bitnamilegacy/kubectl } }
          ephemeralReports:        { image: { repository: bitnamilegacy/kubectl } }
          clusterEphemeralReports: { image: { repository: bitnamilegacy/kubectl } }
          updateRequests:          { image: { repository: bitnamilegacy/kubectl } }
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
