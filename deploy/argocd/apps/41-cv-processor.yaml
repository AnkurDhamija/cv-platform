apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cv-processor
  namespace: argocd
spec:
  project: default
  source:
    repoURL: __REPO_URL__
    targetRevision: HEAD
    path: deploy/base/cv-processor
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated: { prune: true, selfHeal: true }
