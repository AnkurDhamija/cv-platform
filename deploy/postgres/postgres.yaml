# PostgreSQL — metadata store, backend namespace only.
# Credentials come from the Secret `cv-db-credentials`, provided by a
# SealedSecret (deploy/secrets) so nothing plaintext is committed to Git.
# Hardened to satisfy the 'restricted' Pod Security Standard.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: backend
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: backend
  labels: { app: postgres }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: postgres:16.4-bookworm
          ports: [{ containerPort: 5432 }]
          envFrom:
            - secretRef: { name: cv-db-credentials }
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - { name: postgres-data, mountPath: /var/lib/postgresql/data }
            - { name: run,   mountPath: /var/run/postgresql }
            - { name: tmp,   mountPath: /tmp }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "cvuser", "-d", "cvs"] }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "cvuser", "-d", "cvs"] }
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - { name: postgres-data, persistentVolumeClaim: { claimName: postgres-data } }
        - { name: run, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: backend
  labels: { app: postgres }
spec:
  selector: { app: postgres }
  ports:
    - { port: 5432, targetPort: 5432 }
