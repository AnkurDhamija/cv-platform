{{- if .Values.networkPolicies.enabled }}
# Backend segmentation (INGRESS). Default-deny ingress; cv-processor only from
# public-api, postgres only from cv-processor. Egress unrestricted on GKE (see
# frontend policy comment for why); egress control is proven on kind + documented.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny-ingress, namespace: {{ .Values.namespace }} }
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: cv-processor, namespace: {{ .Values.namespace }} }
spec:
  podSelector: { matchLabels: { app: cv-processor } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: frontend } }
          podSelector: { matchLabels: { app: public-api } }
      ports: [{ port: 8081, protocol: TCP }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: postgres, namespace: {{ .Values.namespace }} }
spec:
  podSelector: { matchLabels: { app: postgres } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: cv-processor } }
      ports: [{ port: 5432, protocol: TCP }]
{{- end }}
