apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres, namespace: {{ .Values.namespace }}, labels: { app: postgres } }
spec:
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          envFrom: [{ secretRef: { name: cv-db-credentials } }]   # provided by External Secrets
          ports: [{ containerPort: 5432 }]
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
          readinessProbe: { exec: { command: ["pg_isready","-U","cvuser"] }, initialDelaySeconds: 10, periodSeconds: 5 }
      volumes: [{ name: data, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: {{ .Values.namespace }}, labels: { app: postgres } }
spec: { selector: { app: postgres }, ports: [{ port: 5432, targetPort: 5432 }] }
