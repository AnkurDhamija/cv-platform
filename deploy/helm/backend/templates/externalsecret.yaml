{{- if .Values.externalSecrets.enabled }}
# ------------------------------------------------------------------------------
# DB credential via External Secrets Operator + GCP Secret Manager (keyless, WI).
# NOTE: the RUNNING cv-db-credentials secret is currently managed outside this
# chart. This template documents the declarative form; reconcile the remoteRef
# keys with your Secret Manager layout before enabling (externalSecrets.enabled).
# ------------------------------------------------------------------------------
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata: { name: {{ .Values.externalSecrets.secretStoreName }}, namespace: {{ .Values.namespace }} }
spec:
  provider:
    gcpsm:
      projectID: {{ .Values.externalSecrets.projectID | quote }}
      auth:
        workloadIdentity:
          clusterLocation: {{ .Values.externalSecrets.clusterLocation | quote }}
          clusterName: {{ .Values.externalSecrets.clusterName | quote }}
          serviceAccountRef:
            name: {{ .Values.externalSecrets.serviceAccountName | quote }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: {{ .Values.externalSecrets.targetSecret }}, namespace: {{ .Values.namespace }} }
spec:
  refreshInterval: 1h
  secretStoreRef: { name: {{ .Values.externalSecrets.secretStoreName }}, kind: SecretStore }
  target:
    name: {{ .Values.externalSecrets.targetSecret }}
    template:
      engineVersion: v2
      data:
        PG_DSN: "postgresql://{{ `{{ .username }}` }}:{{ `{{ .password }}` }}@postgres.{{ .Values.namespace }}.svc.cluster.local:5432/{{ `{{ .dbname }}` }}"
        POSTGRES_USER: "{{ `{{ .username }}` }}"
        POSTGRES_PASSWORD: "{{ `{{ .password }}` }}"
        POSTGRES_DB: "{{ `{{ .dbname }}` }}"
  data:
    - secretKey: username
      remoteRef: { key: {{ .Values.externalSecrets.remoteKey }}, property: username }
    - secretKey: password
      remoteRef: { key: {{ .Values.externalSecrets.remoteKey }}, property: password }
    - secretKey: dbname
      remoteRef: { key: {{ .Values.externalSecrets.remoteKey }}, property: dbname }
{{- end }}
