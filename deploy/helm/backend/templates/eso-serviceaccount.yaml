{{- if .Values.externalSecrets.enabled }}
# KSA referenced by the ESO SecretStore (serviceAccountRef). Workload-Identity
# bound to the ESO Google SA; the IAM binding lives in terraform/gcp/modules/iam.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.externalSecrets.serviceAccountName }}
  namespace: {{ .Values.namespace }}
  annotations:
    iam.gke.io/gcp-service-account: {{ .Values.externalSecrets.gsaName }}@{{ .Values.externalSecrets.projectID }}.iam.gserviceaccount.com
{{- end }}
