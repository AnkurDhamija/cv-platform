# =============================================================================
# PRODUCTION signature policy (GKE / CI). ENFORCE mode.
# Admits an image ONLY if it carries a keyless Sigstore signature produced by
# OUR specific CI identity: the GitHub Actions OIDC issuer, and a subject that
# is exactly our repo's CI workflow on the main branch. Any other signer, or an
# unsigned image, is rejected. This is the Part 5 requirement.
#
# Replace __GH_OWNER__/__GH_REPO__ with the real values before applying on GKE.
# Locally we cannot mint OIDC identities, so make up/verify use the key-based
# equivalent (verify-images-local, generated by scripts/policies-install.sh).
# =============================================================================
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-image-signatures
  annotations:
    policies.kyverno.io/title: Verify image signatures (keyless, our CI identity)
    policies.kyverno.io/severity: critical
spec:
  validationFailureAction: Enforce
  background: false
  webhookTimeoutSeconds: 30
  rules:
    - name: verify-signed-by-our-ci
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: ["frontend", "backend"]
      verifyImages:
        - imageReferences:
            - "*/public-api*"
            - "*/cv-processor*"
          # Mutates the tag to the verified digest -> also enforces by-digest.
          mutateDigest: true
          verifyDigest: true
          required: true
          attestors:
            - count: 1
              entries:
                - keyless:
                    issuer: "https://token.actions.githubusercontent.com"
                    subject: "https://github.com/__GH_OWNER__/__GH_REPO__/.github/workflows/ci.yml@refs/heads/main"
                    rekor:
                      url: "https://rekor.sigstore.dev"
